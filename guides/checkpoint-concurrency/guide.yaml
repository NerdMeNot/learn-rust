# Checkpoint: Concurrency. One cargo binary per question (rust/src/bin/qN.rs). The
# questions that must not compile live in fails/ and are swapped in for the run, so the
# project itself always builds. fixes/q6.rs is the answer to the fix-it question.
name: checkpoint-concurrency
sessions:
  q1:
    dir: rust
    steps:
      - cmd: cargo run --bin q1
  q2:
    dir: rust
    steps:
      - cmd: cargo run --bin q2
  q3:
    dir: rust
    steps:
      - cmd: cargo run --bin q3
  q4:
    dir: rust
    overlay:
      src/bin/q4.rs: fails/q4.rs
    steps:
      - cmd: cargo run --bin q4
        expect: fail
  q5:
    dir: rust
    overlay:
      src/bin/q5.rs: fails/q5.rs
    steps:
      - cmd: cargo run --bin q5
        expect: fail
  q6:
    dir: rust
    overlay:
      src/bin/q6.rs: fails/q6.rs
    steps:
      - cmd: cargo run --bin q6
        expect: fail
  q6-fixed:
    dir: rust
    overlay:
      src/bin/q6.rs: fixes/q6.rs
    steps:
      - cmd: cargo run --bin q6
  q7:
    dir: rust
    overlay:
      src/bin/q7.rs: fails/q7.rs
    steps:
      - cmd: cargo run --bin q7
        expect: fail
