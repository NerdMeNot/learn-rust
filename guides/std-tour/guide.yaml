# A tour of the standard library
name: std-tour
sessions:
  run:
    dir: rust
    steps:
      - cmd: cargo run
  no-import:
    dir: rust
    overlay:
      src/main.rs: gotcha/main.rs
    steps:
      - cmd: cargo build
        expect: fail
  with-import:
    dir: rust
    overlay:
      src/main.rs: gotcha/fixed.rs
    steps:
      - cmd: cargo run
  go-map:
    dir: gotcha-go
    steps:
      - cmd: go run main.go
gotcha:
  kind: compile
  title: Using HashMap like you use Vec
  verdict: rust-rule
  looks_fine: In Go, maps are part of the language, like slices. Nothing to import.
  rust_sees: >-
    `Vec` is in the prelude, so it's always there. `HashMap` lives in `std::collections`
    and needs a `use` line.
  why: >-
    The prelude is kept short on purpose, so your own names rarely clash with std's.
    `Vec` and `String` made the cut because nearly every file uses them. Maps are common,
    but not that common. The error message tells you the exact line to add.
  code: { file: gotcha/main.rs, name: src/main.rs }
  session: no-import
  fixed: { file: gotcha/fixed.rs, name: src/main.rs, session: with-import }
  langs:
    go:
      status: runs
      says: In Go, maps are part of the language, like slices. Nothing to import.
      file: gotcha-go/main.go
      session: go-map
    kotlin:
      status: none
      says: Kotlin imports its collections for you, so `mutableMapOf` and `HashMap` work with no import.
