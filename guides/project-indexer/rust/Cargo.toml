[package]
name = "indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }
tokio-util = "0.7.20"

[dev-dependencies]
# `test-util` gives tests a clock they can pause: sleeps finish instantly and in a fixed order.
tokio = { version = "1.54.1", features = ["test-util"] }
