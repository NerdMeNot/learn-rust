[package]
name = "stock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
clone_on_ref_ptr = "warn"
allow_attributes_without_reason = "warn"
