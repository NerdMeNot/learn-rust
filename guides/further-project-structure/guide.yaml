# Project structure: one workspace, two crates, one feature
name: wordstat
sessions:
  # What a workspace looks like to Cargo: the packages and the targets in each.
  layout:
    dir: rust
    steps:
      - cmd: |-
          cargo metadata --format-version 1 --no-deps | python3 -c 'import json, sys; [print(p["name"], [t["kind"][0] + " " + t["name"] for t in p["targets"]]) for p in json.load(sys.stdin)["packages"]]'
        show: '$ cargo metadata --format-version 1 --no-deps    # then print each package and its targets'
  run:
    dir: rust
    steps:
      - cmd: cargo run -q -- the cat and the dog the
        show: '$ cargo run -p wordstat -- the cat and the dog the'
      - cmd: cargo run -q -p wordstat-report
      - cmd: cargo run -q -p wordstat
        expect: fail
        show: '$ cargo run -p wordstat    # no words'
  # The same crate with the feature off and on.
  features:
    dir: rust
    steps:
      - cmd: cargo run -p wordstat --bin dump -- the cat the dog
        expect: fail
      - cmd: cargo run -q -p wordstat --features json --bin dump -- the cat the dog
      - cmd: cargo tree -p wordstat
      - cmd: cargo tree -p wordstat --features json
      - cmd: cargo test -p wordstat 2>&1 | grep -E '^(     Running|   Doc-tests)|^test |test result' | sed -E 's/finished in [0-9.]+s/finished in X.XXs/'
        show: '$ cargo test -p wordstat    # timings replaced by X.XXs'
      - cmd: cargo test 2>&1 | grep -E '^(     Running|   Doc-tests)|^test |test result' | sed -E 's/finished in [0-9.]+s/finished in X.XXs/'
        show: '$ cargo test    # the whole workspace; timings replaced by X.XXs; the doc tests can print in either order'
        varies: true
  # A feature-gated method used with the feature off.
  gated:
    dir: rust
    overlay:
      crates/wordstat/src/main.rs: fixes/gated-main.rs
    steps:
      - cmd: cargo build -p wordstat
        expect: fail
  # Private things stay private to other crates.
  private:
    dir: rust
    overlay:
      crates/wordstat/src/bin/peek.rs: fixes/peek.rs
    steps:
      - cmd: cargo build -p wordstat --bin peek
        expect: fail
  lints-warn:
    dir: rust
    overlay:
      crates/wordstat/src/lib.rs: fixes/lints-lib.rs
    steps:
      - cmd: cargo clippy --workspace
  # Things to try: each step is one task from the page's "Try it yourself".
  try:
    dir: rust
    steps:
      - cmd: cargo build -p wordstat --features nope
        expect: fail
      - cmd: cargo tree --workspace -i serde_json
  try-deny:
    dir: rust
    overlay:
      crates/wordstat/src/lib.rs: fixes/lints-lib.rs
    steps:
      - cmd: sed -i 's/missing_docs = "warn"/missing_docs = "deny"/' Cargo.toml && cargo clippy --workspace
        show: '$ cargo clippy --workspace    # after changing missing_docs to "deny" in Cargo.toml'
        expect: fail
  fmt:
    dir: rust
    steps:
      - cmd: cargo fmt --check
  docs:
    dir: rust
    steps:
      - cmd: cargo doc --no-deps -p wordstat
      - cmd: cargo test --doc -p wordstat --features json 2>&1 | grep -v '^all doctests ran' | sed -E 's/finished in [0-9.]+s/finished in X.XXs/'
        show: '$ cargo test --doc -p wordstat --features json    # timings masked; the two tests can print in either order'
        varies: true
  # rust-version is checked by Cargo: a too-new MSRV is refused, a correct one builds.
  msrv-refused:
    dir: rust
    overlay:
      Cargo.toml: fixes/msrv.Cargo.toml
    steps:
      - cmd: cargo build
        expect: fail
  # Needs network: installs a second toolchain, then builds and tests with exactly 1.85.0.
  msrv-check:
    dir: rust
    steps:
      - cmd: rustup toolchain install 1.85.0 --profile minimal 2>&1 | grep installed
        show: '$ rustup toolchain install 1.85.0 --profile minimal    # needs network'
        timeout: 600
      - cmd: cargo +1.85.0 --version
      - cmd: cargo +1.85.0 test 2>&1 | grep -E '^(     Running|   Doc-tests)|^test |test result' | sed -E 's/finished in [0-9.]+s/finished in X.XXs/'
        show: '$ cargo +1.85.0 test    # timings replaced by X.XXs; the doc tests can print in either order'
        varies: true
  locked:
    dir: rust
    steps:
      - cmd: cargo build --locked
      - cmd: grep -c '^name = ' Cargo.lock
        show: '$ grep -c "^name = " Cargo.lock    # packages in the one lock file'
      - cmd: cargo tree --workspace --prefix none | sed 's/ (.*//' | sort -u
        show: '$ cargo tree --workspace --prefix none    # then without paths, sorted, one line per package'
      - cmd: sed -n '/^name = "serde_core"/,/^$/p' Cargo.lock | grep -A2 '^dependencies'
        show: '$ sed -n ''/^name = "serde_core"/,/^$/p'' Cargo.lock    # its dependencies, as the lock file lists them'
  go:
    dir: langs
    steps:
      - cmd: go run example.com/app the cat and the dog the
        cwd: go
      - cmd: go run example.com/app/cmd/dump the cat the dog
        cwd: go
        expect: fail
      - cmd: go run -tags json example.com/app/cmd/dump the cat the dog
        cwd: go
  go-internal:
    dir: langs
    overlay:
      go/app/peek/main.go: fixes/go-peek.go
    steps:
      - cmd: go build example.com/app/peek
        cwd: go
        expect: fail
  npm:
    dir: langs
    steps:
      - cmd: npm install --no-audit --no-fund > /dev/null
        cwd: npm
        show: '$ npm install'
      - cmd: npm ls
        cwd: npm
      - cmd: node packages/app/index.js
        cwd: npm
      - cmd: node packages/app/peek.js 2> err.txt; s=$?; grep '^Error' err.txt; exit $s
        cwd: npm
        expect: fail
        show: '$ node packages/app/peek.js'
